trigger:
  fields:
    group_id:
      required: true
      example: living_room
      selector:
        text:
    peak:
      required: false
      default: 1.0
      selector:
        number:
          min: 0.1
          max: 10
          step: 0.1
set_level:
  fields:
    group_id:
      required: true
      example: living_room
      selector:
        text:
    value:
      required: true
      selector:
        number:
          min: 0
          step: 0.1
reset:
  fields:
    group_id:
      required: false
      example: living_room
      selector:
        text:
rebuild_profile:
  fields:
    force:
      required: false
      default: false
      selector:
        boolean:
simulate_now:
  fields:
    group_id:
      required: true
      example: living_room
      selector:
        text:
rebuild_signatures:
  fields:
    force:
      required: false
      default: false
      selector:
        boolean:
locate:
  fields:
    person:
      required: true
      example: Scott
      selector:
        text:
    room:
      required: false
      example: studio
      selector:
        text:
    device:
      example: scott_s_watch
      selector:
        text:
    carried:
      selector:
        boolean:
    clear:
      selector:
        boolean:
    carrying:
      example: '{"scott_s_watch": false}'
      selector:
        object:
    floor:
      example: upstairs
      selector:
        text:
    certainty:
      selector:
        select:
          options:
            - definite
            - probable
    exclude:
      selector:
        boolean:
