[project]
name = "activity-levels"
# Placeholder, never bumped: the version of record is
# custom_components/activity_levels/manifest.json. A real version here would be copied
# into uv.lock and fail `uv sync --locked` on every release PR.
version = "0.0.0"
description = "Home Assistant integration: ADSR-envelope activity levels for areas of your home"
requires-python = ">=3.14.2,<3.15"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "ruff>=0.6",
  "mypy>=1.11",
  "homeassistant==2026.8.3",
  "pytest-homeassistant-custom-component==0.13.357",
  "home-assistant-frontend==20260729.7",
  "pytest-cov>=7.1.0",
  # Only the schema-export test uses it: it checks that config.schema.json really is a
  # draft 2020-12 schema and that examples/house.yaml validates against it. Home
  # Assistant does not ship it, and nothing at runtime imports it.
  "jsonschema>=4.23",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.mypy]
strict = true
python_version = "3.14"
namespace_packages = true
explicit_package_bases = true
files = ["custom_components/activity_levels"]

# HA re-exports these from the websocket_api and http packages without an __all__, so a
# strict no_implicit_reexport rejects the package-level names core's own integrations use.
[[tool.mypy.overrides]]
module = "homeassistant.components.websocket_api"
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = "homeassistant.components.http"
no_implicit_reexport = false
