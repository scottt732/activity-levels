name: pre-commit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hooks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: pre-commit/action@v3.0.1
        env:
          # ruff, mypy, the test suites and the panel build already run in python.yml
          # and frontend.yml, against the versions this project pins. This job is here
          # for the hooks nothing else covers — whitespace, secrets, actionlint,
          # codespell — and to prove the config itself still runs.
          SKIP: ruff-check,ruff-format,uv-lock-check,eslint,panel-bundle

  secrets:
    name: scan the history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The pre-commit hook only sees what a contributor staged, and `--no-verify`
      # skips it entirely. This scans the whole history on every pull request.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
