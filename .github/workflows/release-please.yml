name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A PR opened with GITHUB_TOKEN triggers no workflows, so the release PR would sit
      # blocked behind the required checks forever. workflow_dispatch is exempt from that
      # rule, so run the CI workflows on the release branch ourselves.
      - name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          if [ -z "$PR_JSON" ]; then echo "no release PR this run"; exit 0; fi
          BRANCH="$(jq -r '.headBranchName' <<<"$PR_JSON")"
          echo "dispatching CI on $BRANCH"
          gh workflow run python.yml --ref "$BRANCH"
          gh workflow run frontend.yml --ref "$BRANCH"
