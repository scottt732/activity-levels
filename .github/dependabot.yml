# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2

updates:
  # The Python side: uv reads pyproject.toml and uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production:
        dependency-type: "production"
    ignore:
      # These four track whatever Home Assistant core pins. A major bump means the
      # supported HA version moved, which is a decision, not a chore — so take the
      # minors and patches automatically and leave the majors to a human.
      - dependency-name: "homeassistant"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pytest-homeassistant-custom-component"
        update-types: ["version-update:semver-major"]
      - dependency-name: "home-assistant-frontend"
        update-types: ["version-update:semver-major"]
      - dependency-name: "numpy"
        update-types: ["version-update:semver-major"]

  # The panel.
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(frontend)"
    groups:
      dev-dependencies:
        dependency-type: "development"
      production:
        dependency-type: "production"
    ignore:
      # typescript-eslint does not run against TypeScript 7 (the Go compiler) yet:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940. Take the
      # minors, and the major by hand once the linter follows.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The workflows themselves.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
